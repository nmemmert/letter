services:
  app:
    image: "ghcr.io/nmemmert/letter:main"
    deploy:
      resources:
        reservations:
          memory: 128MB
          cpus: "0.00"
        limits:
          memory: 512MB
          cpus: "1.00"
    restart: no
    network_mode: bridge
    ports:
      - "${APP_PORT:-8080}:80"
    volumes: []

  notifier:
    image: "ghcr.io/nmemmert/letter-notifier:main"
    deploy:
      resources:
        reservations:
          memory: 64MB
          cpus: "0.00"
        limits:
          memory: 128MB
          cpus: "0.25"
    restart: no
    network_mode: bridge
    volumes: []
    environment:
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - NTFY_PRIORITY=${NTFY_PRIORITY:-default}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 9 1 * *}
      - TZ=${TZ:-America/Chicago}
      - APP_URL=${APP_URL:-http://172.16.16.106:8080}
      - NTFY_TEST_ON_START=${NTFY_TEST_ON_START:-false}
    depends_on:
      - app

x-casaos:
  title:
    custom: "Annual Letter"
  main: app
  scheme: http
  hostname: "172.16.16.106"
  index: /
